version: 2.1
commands:
  restore_sbt_cache:
    steps:
      - restore_cache:
          keys:
            - sbt-v2-{{ .Environment.CIRCLE_JOB }}-{{ checksum "build.sbt" }}-{{ checksum "project/plugins.sbt" }}-{{ checksum "project/build.properties" }}
            - sbt-v2-{{ .Environment.CIRCLE_JOB }}-
  save_sbt_cache:
    steps:
      - save_cache:
          key: sbt-v2-{{ .Environment.CIRCLE_JOB }}-{{ checksum "build.sbt" }}-{{ checksum "project/plugins.sbt" }}-{{ checksum "project/build.properties" }}
          paths:
            - "~/.cache/coursier"
            - "~/.ivy2/cache"
            - "~/.sbt"
            - "~/.m2"
jobs:
  lint:
    docker:
      - image: cimg/openjdk:17.0-node
    resource_class: large
    steps:
      - checkout
      - restore_sbt_cache
      - run: sbt ++2.13 check ++3.3 check
      - save_sbt_cache
  test212_jdk:
    docker:
      - image: cimg/openjdk:17.0-node
        environment: &sbt-mem
          SBT_OPTS: "-Xmx2G"
          JAVA_TOOL_OPTIONS: "-Xmx2G"
    resource_class: large
    steps:
      - checkout
      - restore_sbt_cache
      - run: sbt ++2.12 rootJVM212/test
      - save_sbt_cache
  scripted212_sbt1_jdk:
    docker:
      - image: cimg/openjdk:17.0-node
    resource_class: large
    steps:
      - checkout
      - restore_sbt_cache
      - run: sbt ++2.12 "set ThisBuild / Compile / packageDoc / publishArtifact := false" codegenSbt/scripted
      - save_sbt_cache
  scripted3_sbt1_jdk:
    docker:
      - image: cimg/openjdk:17.0-node
    resource_class: large
    steps:
      - checkout
      - restore_sbt_cache
      - run: sbt ++2.12 codegenScriptedScala3
      - save_sbt_cache
  test213_jdk:
    docker:
      - image: cimg/openjdk:17.0-node
        environment: *sbt-mem
    resource_class: large
    steps:
      - checkout
      - restore_sbt_cache
      - run: sbt ++2.13 rootJVM213/test examples/compile benchmarks/test
      - save_sbt_cache
  test213_jdk21:
    docker:
      - image: cimg/openjdk:21.0-node
        environment: *sbt-mem
    resource_class: large
    steps:
      - checkout
      - restore_sbt_cache
      - run: sbt ++2.13 rootJVM213/test examples/compile benchmarks/test
      - save_sbt_cache
  test33_jdk:
    docker:
      - image: cimg/openjdk:17.0-node
        environment: *sbt-mem
    resource_class: large
    steps:
      - checkout
      - restore_sbt_cache
      - run: sbt ++3.3 rootJVM3/test benchmarks/test
      - save_sbt_cache
  test33_jdk21:
    docker:
      - image: cimg/openjdk:21.0-node
        environment: *sbt-mem
    resource_class: large
    steps:
      - checkout
      - restore_sbt_cache
      - run: sbt ++3.3 rootJVM3/test benchmarks/test
      - save_sbt_cache
  test37_jdk:
    docker:
      - image: cimg/openjdk:17.0-node
    resource_class: large
    steps:
      - checkout
      - restore_sbt_cache
      - run: sbt ++3.8.3 codegenSbt/test
      - save_sbt_cache
  scripted3_sbt2_jdk:
    docker:
      - image: cimg/openjdk:17.0-node
    resource_class: large
    steps:
      - checkout
      - restore_sbt_cache
      - run: sbt ++3.8.3 "set ThisBuild / Compile / packageDoc / publishArtifact := false" codegenSbt/scripted
      - save_sbt_cache
  test213_js_native:
    docker:
      - image: cimg/openjdk:17.0-node
    resource_class: large
    steps:
      - checkout
      - restore_sbt_cache
      - run: ./.circleci/install-native-deps.sh
      - run: sbt ++2.13 clientJS/test clientLaminextJS/Test/fastLinkJS clientNative/test
      - save_sbt_cache
  test33_js_native:
    docker:
      - image: cimg/openjdk:17.0-node
    resource_class: large
    steps:
      - checkout
      - restore_sbt_cache
      - run: ./.circleci/install-native-deps.sh
      - run: sbt ++3.3 clientJS/test clientLaminextJS/Test/fastLinkJS clientNative/test
      - save_sbt_cache
  test213_docs:
    docker:
      - image: cimg/openjdk:17.0-node
    resource_class: large
    steps:
      - checkout
      - restore_sbt_cache
      - run: sbt "++2.13 docs/mdoc" "++2.13 doc" "++2.12 doc"
      - save_sbt_cache
  test_mima:
    docker:
      - image: cimg/openjdk:17.0-node
    resource_class: large
    steps:
      - checkout
      - restore_sbt_cache
      - run: sbt ++2.13 http4s/mimaReportBinaryIssues akkaHttp/mimaReportBinaryIssues pekkoHttp/mimaReportBinaryIssues catsInterop/mimaReportBinaryIssues monixInterop/mimaReportBinaryIssues clientJVM/mimaReportBinaryIssues clientJS/mimaReportBinaryIssues clientLaminextJS/mimaReportBinaryIssues federation/mimaReportBinaryIssues reporting/mimaReportBinaryIssues tracing/mimaReportBinaryIssues core/mimaReportBinaryIssues tapirInterop/mimaReportBinaryIssues quickAdapter/mimaReportBinaryIssues play/mimaReportBinaryIssues # tools/mimaReportBinaryIssues
      - run: sbt ++3.3 catsInterop/mimaReportBinaryIssues monixInterop/mimaReportBinaryIssues clientJVM/mimaReportBinaryIssues clientJS/mimaReportBinaryIssues clientLaminextJS/mimaReportBinaryIssues http4s/mimaReportBinaryIssues federation/mimaReportBinaryIssues reporting/mimaReportBinaryIssues tracing/mimaReportBinaryIssues core/mimaReportBinaryIssues tapirInterop/mimaReportBinaryIssues pekkoHttp/mimaReportBinaryIssues quickAdapter/mimaReportBinaryIssues play/mimaReportBinaryIssues # tools/mimaReportBinaryIssues
      - save_sbt_cache
  release:
    docker:
      - image: cimg/openjdk:17.0-node
    resource_class: large
    steps:
      - checkout
      - run: git fetch --tags
      - restore_cache:
          keys:
            - sbt-v2-test213_jdk-
      - run: |
          mkdir ~/.gnupg && chmod 700 ~/.gnupg
          echo use-agent >> ~/.gnupg/gpg.conf
          echo pinentry-mode loopback >> ~/.gnupg/gpg.conf
          echo allow-loopback-pinentry >> ~/.gnupg/gpg-agent.conf
          chmod 600 ~/.gnupg/*
          echo RELOADAGENT | gpg-connect-agent
          echo $PGP_SECRET | base64 --decode | gpg --import --no-tty --batch --yes
      - run: sbt +clean ci-release

  microsite:
    docker:
      - image: cimg/node:16.13
    steps:
      - checkout
      - run: |
          if [ "$(git diff --numstat HEAD^ -- vuepress)" ]; then
            cd vuepress
            npm install
            npm run docs:build
            cd ..
            rm -rf docs
            cp -r vuepress/docs/.vuepress/dist docs
            git add docs
            git config user.name "Pierre Ricadat"
            git config user.email "ghostdogpr@gmail.com"
            git commit -m "[ci skip] update docs"
            git push
          fi

workflows:
  build:
    jobs:
      - lint:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-[\w.-]+)?(\+[\w.-]+)?$/
      - test212_jdk:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-[\w.-]+)?(\+[\w.-]+)?$/
      - scripted212_sbt1_jdk:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-[\w.-]+)?(\+[\w.-]+)?$/
      - scripted3_sbt1_jdk:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-[\w.-]+)?(\+[\w.-]+)?$/
      - test213_js_native:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-[\w.-]+)?(\+[\w.-]+)?$/
      - test33_js_native:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-[\w.-]+)?(\+[\w.-]+)?$/
      - test213_jdk:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-[\w.-]+)?(\+[\w.-]+)?$/
      - test213_jdk21:
          filters:
            branches:
              only:
                - series/3.x
            tags:
              only: /^v\d+\.\d+\.\d+(-[\w.-]+)?(\+[\w.-]+)?$/
      - test213_docs:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-[\w.-]+)?(\+[\w.-]+)?$/
      - test33_jdk:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-[\w.-]+)?(\+[\w.-]+)?$/
      - test33_jdk21:
          filters:
            branches:
              only:
                - series/3.x
            tags:
              only: /^v\d+\.\d+\.\d+(-[\w.-]+)?(\+[\w.-]+)?$/
      - test37_jdk:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-[\w.-]+)?(\+[\w.-]+)?$/
      - scripted3_sbt2_jdk:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-[\w.-]+)?(\+[\w.-]+)?$/
      - test_mima:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-[\w.-]+)?(\+[\w.-]+)?$/
      - release:
          context: Sonatype
          requires:
            - lint
            - test212_jdk
            - scripted212_sbt1_jdk
            - scripted3_sbt1_jdk
            - test213_jdk
            - test213_jdk21
            - test213_js_native
            - test213_docs
            - test33_jdk
            - test33_jdk21
            - test33_js_native
            - test37_jdk
            - scripted3_sbt2_jdk
            - test_mima
          filters:
            branches:
              only:
                - series/1.x
                - series/2.x
                - series/3.x
            tags:
              only: /^v\d+\.\d+\.\d+(-[\w.-]+)?(\+[\w.-]+)?$/
      - microsite:
          filters:
            branches:
              only:
                - series/3.x
