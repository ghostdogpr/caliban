query {
  id
  name
  empty {}
  ... on SomeType {}
}

query {}

mutation {
  thatThing
  thatThingWithArgs(input: {id: 1, name: "test"}) {
    id
    name
  }
}

"Mutation with arguments"
mutation WithArgs("The input" $args: InputType! @someDirective) {
  thatThingWithArgs(input: $args) {
    id @include(if: false)
    name
    ... on SomeType @skip(if: true) {
      someField
    }
    ...SomeTypeFragment
  }
}

subscription {
  event {
    id
    name
  }
}

"""
Fields of
SomeType
"""
fragment SomeTypeFragment on SomeType {
  someField
}