name: Federation Gateway Audit

on:
  pull_request:
    branches:
      - series/3.x
    paths:
      - gateway/**
      - gateway-audit/**
      - core/**
      - federation/**
      - adapters/quick/**
      - tools/**
      - build.sbt
      - project/**
      - .github/workflows/gateway-audit.yaml

jobs:
  audit:
    name: Federation compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Caliban
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: adopt
          cache: sbt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - uses: sbt/setup-sbt@v1
      - name: Cache Scala dependencies
        uses: coursier/cache-action@v6
      - name: Checkout the pinned audit
        shell: bash
        run: |
          source gateway-audit/upstream.env
          git clone "$FEDERATION_GATEWAY_AUDIT_REPOSITORY" "$RUNNER_TEMP/federation-gateway-audit"
          git -C "$RUNNER_TEMP/federation-gateway-audit" checkout "$FEDERATION_GATEWAY_AUDIT_REVISION"
          npm --prefix "$RUNNER_TEMP/federation-gateway-audit" ci --ignore-scripts
      - name: Install the Caliban adapter
        run: ./gateway-audit/install.sh "$RUNNER_TEMP/federation-gateway-audit"
      - name: Run the audit
        run: make -C "$RUNNER_TEMP/federation-gateway-audit" test-caliban
      - name: Verify 100% compatibility
        run: ./gateway-audit/verify-results.sh "$RUNNER_TEMP/federation-gateway-audit/gateways/caliban/results.txt"
